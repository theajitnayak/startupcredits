name: Validate reviewed catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Check publication policy against the actual India date
        run: node scripts/check-catalog.mjs "$(TZ=Asia/Kolkata date +%F)"
